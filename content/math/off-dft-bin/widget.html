<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sine-wave projection</title>
  <link rel="stylesheet" href="../../style.css">
</head>
<body>
<figure class="projection-widget" aria-label="Sine-wave projection across frequency">
  <figcaption>Accumulated dot product <span>S(f, T) / max<sub>f</sub> S(f, T)</span></figcaption>
  <div class="projection-plots"></div>
  <div class="projection-controls" hidden>
    <button type="button" class="projection-play" aria-label="Play time animation">Play</button>
    <label for="projection-time">T = <output for="projection-time">2.00 s</output></label>
    <input id="projection-time" type="range" min="0" max="20" step="0.01" value="2">
  </div>
  <noscript>JavaScript is required for the plot.</noscript>
</figure>
<style>
html { background: transparent; }
body { max-width: none; margin: 0; padding: 0; }
.projection-widget { margin: 0; padding: .25rem; font: .8rem/1.5 ui-sans-serif, system-ui, sans-serif; }
.projection-widget figcaption span { display: block; color: var(--muted); font-size: .75rem; }
.projection-controls { align-items: center; gap: .65rem; }
.projection-controls:not([hidden]) { display: flex; }
.projection-controls label { white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 5.5rem; }
.projection-play { padding: .2rem .35rem; min-width: 3.5rem; border: 1px solid var(--rule); border-radius: .2rem; color: var(--text); background: transparent; font: inherit; cursor: pointer; }
.projection-widget input { width: 100%; min-width: 0; margin: .5rem 0; accent-color: var(--link); }
.projection-widget :focus-visible { outline: 2px solid var(--link); outline-offset: 3px; }
.projection-widget svg { display: block; width: 100%; height: auto; margin: .5rem 0; }
.projection-widget svg text { fill: var(--muted); font: 12px ui-sans-serif, system-ui, sans-serif; }
</style>
<script>
(() => {
  const widget = document.querySelector('.projection-widget');
  const slider = widget.querySelector('input[type="range"]');
  const plots = widget.querySelector('.projection-plots');
  const play = widget.querySelector('.projection-play');
  const dt = 0.001, duration = 20, frequencyStep = 0.005;
  let animation = null, previousTime = null, elapsed = Number(slider.value);

  // Exact finite cosine sum for samples k = 0, …, n - 1. Product-to-sum
  // gives the same dot product as a sample loop without repeating it per frame.
  function cosineSum(frequency, n) {
    const a = Math.PI * frequency * dt;
    return Math.abs(a) < 1e-12 ? n
      : Math.sin(n * a) / Math.sin(a) * Math.cos((n - 1) * a);
  }
  function projection(frequency, n) {
    return dt / 2 * (cosineSum(1 - frequency, n) - cosineSum(1 + frequency, n));
  }
  function render() {
    const time = Number(slider.value), n = Math.round(time / dt);
    const values = Array.from({ length: Math.round(10 / frequencyStep) + 1 },
      (_, i) => projection(i * frequencyStep, n));
    const peak = Math.max(...values);
    // Normalize by the current frequency sweep's positive maximum, preserving
    // signs. At T = 0 every sum is zero, so leave the curve at zero.
    const normalized = values.map(value => peak > 0 ? value / peak : 0);
    const width = Math.max(260, Math.min(640, plots.clientWidth));
    const left = 34, right = width - 24, top = 42, bottom = 242;
    const x = f => left + f / 10 * (right - left);
    const y = v => bottom - (v + 1.05) / 2.1 * (bottom - top);
    const description = `Peak-normalized sine projection over 0–10 Hz at T = ${time.toFixed(2)} s; 1 Hz: ${normalized[Math.round(1 / frequencyStep)].toFixed(4)}; 1.5 Hz: ${normalized[Math.round(1.5 / frequencyStep)].toFixed(4)}`;
    let svg = `<svg viewBox="0 0 ${width} 274" role="img" aria-label="${description}"><title>${description}</title>`;
    for (const value of [-1, 0, 1]) {
      svg += `<path d="M${left},${y(value)}H${right}" stroke="var(--rule)"/><text x="${left - 8}" y="${y(value) + 4}" text-anchor="end">${value}</text>`;
    }
    for (const frequency of [0, 2, 4, 6, 8, 10]) {
      svg += `<text x="${x(frequency)}" y="267" text-anchor="middle">${frequency}${frequency === 10 ? ' Hz' : ''}</text>`;
    }
    for (const frequency of [1, 1.5]) {
      const labelY = frequency === 1 ? 14 : 33;
      svg += `<path data-reference="${frequency}" d="M${x(frequency)},${labelY + 5}V${bottom}" stroke="var(--link)" stroke-opacity=".6" ${frequency === 1.5 ? 'stroke-dasharray="3 4"' : ''}/><text x="${x(frequency) + 4}" y="${labelY}">${frequency} Hz</text>`;
    }
    const points = [];
    for (let i = 0; i <= Math.round(10 / frequencyStep); i++) {
      const frequency = i * frequencyStep;
      points.push(`${i ? 'L' : 'M'}${x(frequency).toFixed(2)},${y(normalized[i]).toFixed(3)}`);
    }
    svg += `<path class="projection-curve" d="${points.join(' ')}" fill="none" stroke="var(--text)" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
    plots.innerHTML = svg;
    widget.querySelector('output').textContent = `${time.toFixed(2)} s`;
    slider.setAttribute('aria-valuetext', `${time.toFixed(2)} seconds`);
  }
  function pause() {
    if (animation !== null) cancelAnimationFrame(animation);
    animation = null;
    previousTime = null;
    play.textContent = 'Play';
    play.setAttribute('aria-label', 'Play time animation');
  }
  function tick(now) {
    if (previousTime !== null) elapsed = Math.min(duration, elapsed + (now - previousTime) / 1000);
    previousTime = now;
    slider.value = elapsed.toFixed(2);
    render();
    if (elapsed >= duration) pause();
    else animation = requestAnimationFrame(tick);
  }
  play.addEventListener('click', () => {
    if (animation !== null) { pause(); return; }
    elapsed = Number(slider.value) >= duration ? 0 : Number(slider.value);
    previousTime = null;
    play.textContent = 'Pause';
    play.setAttribute('aria-label', 'Pause time animation');
    animation = requestAnimationFrame(tick);
  });
  slider.addEventListener('input', () => { pause(); render(); });
  window.addEventListener('resize', render);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  // Keep an embedded widget sized to its contents and in the post's theme.
  if (window.frameElement) {
    const syncTheme = () => {
      const theme = parent.document.documentElement.dataset.theme;
      if (theme) document.documentElement.dataset.theme = theme;
      else delete document.documentElement.dataset.theme;
    };
    syncTheme();
    new MutationObserver(syncTheme).observe(parent.document.documentElement, {
      attributes: true, attributeFilter: ['data-theme']
    });
    new ResizeObserver(() => {
      window.frameElement.style.height = `${Math.ceil(document.body.getBoundingClientRect().height) + 2}px`;
    }).observe(document.body);
  }
  render();
  widget.querySelector('.projection-controls').hidden = false;
})();
</script>
</body>
</html>
